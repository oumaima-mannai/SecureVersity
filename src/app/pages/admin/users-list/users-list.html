<div class="card p-6 shadow-sm border border-slate-200">
  <div class="header-flex mb-6">
    <div>
      <h1 class="text-2xl font-bold">Account Management</h1>
      <p class="text-slate-500 text-sm">Create and easily manage platform users.</p>
    </div>
    <a routerLink="create-user" class="btn btn-primary">+ Create User</a>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>{{ user.fullName || '—' }}</td>
            <td class="text-muted">{{ user.email }}</td>
            <td>
              <span class="badge badge-role">{{ user.role }}</span>
            </td>
            <td>
              @if (user.isActive) {
                <span class="status-active">● Active</span>
              } @else {
                <span class="status-inactive">● Inactive</span>
              }
            </td>
          </tr>
        } @empty {
          <tr>
             <td colspan="4" class="empty-state">No users found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
